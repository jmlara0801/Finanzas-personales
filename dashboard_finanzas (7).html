<head>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0d1117;color:#e2e8f0;font-family:system-ui,sans-serif;min-height:100vh}
.dash{padding:14px}
.topbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:#161b27;border:1px solid #2d3748;border-radius:10px;padding:9px 14px;margin-bottom:12px}
.topbar label{font-size:10px;color:#64748b;margin-right:2px}
.topbar select{background:#0d1117;color:#e2e8f0;border:1px solid #2d3748;border-radius:6px;padding:4px 8px;font-size:11px;cursor:pointer}
.topbar select:focus{outline:none;border-color:#4D9FFF}
.badge{margin-left:auto;font-size:9px;color:#4D9FFF}
.sec{font-size:9px;text-transform:uppercase;letter-spacing:1.2px;color:#4D9FFF;margin-bottom:8px;font-weight:500}
.kpi-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;margin-bottom:12px}
.kpi{background:#161b27;border:1px solid #2d3748;border-radius:10px;padding:12px;position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;top:0;left:0;right:0;height:2px;border-radius:2px 2px 0 0}
.kpi.ki::before{background:#00C48C}.kpi.ke::before{background:#FF4D6A}
.kpi.kb::before{background:#4D9FFF}.kpi.kr::before{background:#FFB547}
.kpi.kac::before{background:#9B59B6}
.kl{font-size:10px;color:#64748b;margin-bottom:4px}
.kv{font-size:18px;font-weight:500;line-height:1.2;margin-bottom:3px}
.kv-big{font-size:26px;font-weight:600;line-height:1.1;margin-bottom:2px}
.kp{font-size:10px;color:#94a3b8;margin-bottom:2px;display:flex;align-items:center;gap:5px}
.kpsmall{font-size:9px;color:#64748b}
.kdelta{font-size:9px;margin-top:2px}
.knote{font-size:9px;color:#64748b;margin-top:3px}
.pos{color:#00C48C}.neg{color:#FF4D6A}
.mid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.card{background:#161b27;border:1px solid #2d3748;border-radius:10px;padding:14px}
.donut-wrap{display:grid;grid-template-columns:175px 1fr;gap:10px;align-items:center}
.leg-row{display:flex;align-items:center;gap:4px;margin-bottom:3px;font-size:9px}
.leg-dot{width:7px;height:7px;border-radius:2px;flex-shrink:0}
.leg-name{color:#94a3b8;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.leg-pct{color:#cbd5e1;min-width:28px;text-align:right}
.leg-amt{color:#64748b;min-width:62px;text-align:right;font-size:8px}
.sm-row{margin-bottom:7px}.sm-row:last-child{margin-bottom:0}
.sm-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:2px}
.sm-name{font-size:10px;color:#cbd5e1}.sm-pct{font-size:9px;font-weight:500}
.sm-bar{height:5px;background:#2d3748;border-radius:2px;overflow:hidden;margin-bottom:2px}
.sm-fill{height:100%;border-radius:2px}
.sm-det{font-size:9px;color:#64748b;display:flex;justify-content:space-between}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.full{margin-bottom:10px}
.pwrap{position:relative}
.tscroll{overflow-x:auto;margin-top:4px}
table.rt{width:100%;border-collapse:collapse;font-size:11px;table-layout:fixed}
table.rt colgroup col.cname{width:60%}
table.rt colgroup col.cnum{width:10%}
table.rt th{color:#64748b;font-weight:400;padding:6px 8px;text-align:right;border-bottom:1px solid #2d3748;white-space:nowrap;overflow:hidden}
table.rt th:first-child{text-align:left}
table.rt td{padding:4px 8px;border-bottom:.5px solid #0d1117;text-align:right;color:#94a3b8;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
table.rt td:first-child{text-align:left;white-space:normal;word-break:break-word}
table.rt .tr2 td{color:#e2e8f0;font-weight:500;background:#1a2035;cursor:pointer}
table.rt .tr2:hover td{background:#253354;color:#fff}
table.rt .tr1 td{font-size:10px;cursor:pointer}
table.rt .tr1 td:first-child{padding-left:20px;color:#cbd5e1}
table.rt .tr1:hover td{background:#1e2a45;color:#e2e8f0}
table.rt .trp td{font-size:10px;cursor:pointer}
table.rt .trp td:first-child{padding-left:38px;color:#94a3b8}
table.rt .trp:hover td{background:#192238;color:#cbd5e1}
table.rt .trd td{font-size:9px;cursor:default}
table.rt .trd td:first-child{padding-left:56px;color:#64748b}
table.rt .trd:hover td{background:#141c2e;color:#94a3b8}
table.rt .trd:hover td:first-child{color:#a0aec0}
.tog{background:none;border:none;color:#4D9FFF;cursor:pointer;font-size:9px;margin-right:3px;padding:0;vertical-align:middle}
table.rt tr td{transition:background 0.12s,color 0.12s}
table.rt .trd:hover td:first-child{border-left:3px solid #4D9FFF;padding-left:53px}
table.rt .trp:hover td:first-child{border-left:3px solid #FFB547;padding-left:35px}
table.rt .tr1:hover td:first-child{border-left:3px solid #00C48C;padding-left:17px}
/* Make amount column text brighter on hover so it's easy to read */
table.rt .trd:hover td:nth-child(2){color:#e2e8f0;font-weight:500}
table.rt .trp:hover td:nth-child(2){color:#e2e8f0;font-weight:500}
table.rt .tr1:hover td:nth-child(2){color:#e2e8f0;font-weight:500}
</style>
</head>

function tMes(r){return r[0];}function tAno(r){return r[1];}function tImp(r){return r[2];}

function tNom(r){return r[6];}function tDesc(r){return r[7]||'';}

function fmt(n){return 'S/ '+Math.round(n).toLocaleString('es-PE');}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

function getF(){
  return{ano:document.getElementById('sA').value,mes:document.getElementById('sM').value,
    nom:document.getElementById('sN').value,tipo:document.getElementById('sT').value};
}
function filtTX(f){
  return TX.filter(function(r){
    if(f.ano && tAno(r)!=+f.ano) return false;
    if(f.mes && tMes(r)!=+f.mes) return false;
    if(f.nom && tNom(r)!==f.nom) return false;
    if(f.tipo && tTipo(r)!==f.tipo) return false;
    return true;
  });
}
function filtPP(f){
  return PP.filter(function(r){
    if(f.ano && tAno(r)!=+f.ano) return false;
    if(f.mes && tMes(r)!=+f.mes) return false;
    return true;
  });
}
function getPrev(f){
  if(!f.mes||!f.ano) return null;
  var pm=+f.mes-1, pa=+f.ano;
  if(pm<1){pm=12;pa--;}
  return TX.filter(function(r){return tAno(r)===pa&&tMes(r)===pm&&(!f.nom||tNom(r)===f.nom);});
}
function sum(data){
  var i=0,e=0;
  data.forEach(function(r){
    if(tTipo(r)==='Ingreso') i+=tImp(r);
    else e+=Math.abs(tImp(r));
  });
  return{i:i,e:e,b:i-e};
}
function getSaldo(f){
  if(!f.mes||!f.ano){
    if(!SALDO.length) return{real:0,ppto:0};
    var last=SALDO[SALDO.length-1]; return{real:last[2],ppto:last[3]};
  }
  for(var i=0;i<SALDO.length;i++){
    if(SALDO[i][0]==+f.mes&&SALDO[i][1]==+f.ano) return{real:SALDO[i][2],ppto:SALDO[i][3]};
  }
  var best=null;
  SALDO.forEach(function(s){
    if(s[1]<+f.ano||(s[1]==+f.ano&&s[0]<=+f.mes)) best=s;
  });
  return best?{real:best[2],ppto:best[3]}:{real:0,ppto:0};
}

function updateMeses(){
  var ano=+document.getElementById('sA').value;
  var meses=[];
  TX.forEach(function(r){if(tAno(r)===ano&&meses.indexOf(tMes(r))<0) meses.push(tMes(r));});
  meses.sort(function(a,b){return a-b;});
  var sM=document.getElementById('sM');
  var prev=+sM.value;
  sM.innerHTML='<option value="">Todos</option>'+meses.map(function(m){return '<option value="'+m+'">'+MN[m]+'</option>';}).join('');
  if(meses.indexOf(prev)>=0) sM.value=prev;
  else{ var last=meses[meses.length-1]; if(last) sM.value=last; }
}
function destroyAll(){Object.keys(CHS).forEach(function(k){try{CHS[k].destroy();}catch(e){}});CHS={};}

function pptoBadge(real,ppto,invert){
  if(!ppto) return '';
  var d=real-ppto, pct=Math.round(Math.abs(d)/ppto*100);
  var ok=invert?(real<=ppto):(real>=ppto);
  var cls=ok?'pos':'neg';
  var sign=ok?'&#x2713;':(d>0?'+':'-');
  return '<span class="'+cls+'">'+sign+pct+'%</span>';
}
function deltaLine(real,ref){
  if(ref==null||ref===undefined) return '';
  var d=real-ref, cls=d>=0?'pos':'neg', arrow=d>=0?'&#x25B2;':'&#x25BC;';
  return '<div class="kdelta '+cls+'">'+arrow+' '+fmt(Math.abs(d))+' vs mes ant.</div>';
}

function buildSemaforo(tx,pp){
  var rM={}, pM={};
  tx.forEach(function(r){if(tTipo(r)==='Egreso') rM[tR2(r)]=(rM[tR2(r)]||0)+Math.abs(tImp(r));});
  pp.forEach(function(r){if(tTipo(r)==='Egreso'&&tImp(r)!==0) pM[tR2(r)]=(pM[tR2(r)]||0)+Math.abs(tImp(r));});
  var rows=Object.keys(pM).filter(function(k){return pM[k]>0;}).map(function(k){
    return{k:k,r:rM[k]||0,p:pM[k],pct:(rM[k]||0)/pM[k]*100};
  }).sort(function(a,b){return b.pct-a.pct;});
  if(!rows.length){document.getElementById('sem').innerHTML='<div style="font-size:10px;color:#64748b;padding:8px">Sin presupuesto para el per\u00edodo</div>';return;}
  var h='';
  rows.forEach(function(x){
    var col=x.pct<85?'#00C48C':x.pct<100?'#FFB547':'#FF4D6A';
    var w=Math.min(100,x.pct), dev=x.r-x.p;
    h+='<div class="sm-row">';
    h+='<div class="sm-hdr"><span class="sm-name">'+esc(x.k)+'</span><span class="sm-pct" style="color:'+col+'">'+Math.round(x.pct)+'%</span></div>';
    h+='<div class="sm-bar"><div class="sm-fill" style="width:'+w+'%;background:'+col+'"></div></div>';
    h+='<div class="sm-det"><span>'+fmt(x.r)+' / '+fmt(x.p)+'</span><span style="color:'+(dev>0?'#FF4D6A':'#00C48C')+'">'+(dev>0?'+':'')+fmt(dev)+'</span></div>';
    h+='</div>';
  });
  document.getElementById('sem').innerHTML=h;
}

function buildDonut(tx){
  var m={};
  tx.forEach(function(r){if(tTipo(r)==='Egreso') m[tR2(r)]=(m[tR2(r)]||0)+Math.abs(tImp(r));});
  var sorted=Object.entries(m).filter(function(e){return e[1]>0;}).sort(function(a,b){return b[1]-a[1];}).slice(0,9);
  var total=sorted.reduce(function(s,e){return s+e[1];},0);
  CHS.don=new Chart(document.getElementById('cDon').getContext('2d'),{
    type:'doughnut',
    data:{labels:sorted.map(function(e){return e[0];}),datasets:[{
      data:sorted.map(function(e){return Math.round(e[1]);}),
      backgroundColor:sorted.map(function(e){return RC[e[0]]||'#888';}),
      borderColor:'#0d1117',borderWidth:2,hoverOffset:4
    }]},
    options:{responsive:true,maintainAspectRatio:false,cutout:'63%',plugins:{
      legend:{display:false},
      tooltip:{backgroundColor:'#161b27',titleColor:'#94a3b8',bodyColor:'#e2e8f0',
        callbacks:{label:function(c){return c.label+': '+fmt(c.raw)+' ('+Math.round(c.raw/total*100)+'%)';}}}
    }}
  });

    h+='<div class="leg-row">';
    h+='<span class="leg-dot" style="background:'+(RC[e[0]]||'#888')+'"></span>';
    h+='<span class="leg-name">'+esc(e[0])+'</span>';
    h+='<span class="leg-pct">'+Math.round(e[1]/total*100)+'%</span>';
    h+='<span class="leg-amt">'+fmt(e[1])+'</span>';
    h+='</div>';
  });
  document.getElementById('legDon').innerHTML=h;
}

function buildTendencia(){
  var m={};
  TX.forEach(function(r){
    if(tImp(r)===0) return;
    if(tAno(r)===2025&&tMes(r)<7) return;
    var k=tAno(r)+'-'+(tMes(r)<10?'0':'')+tMes(r);
    if(!m[k]) m[k]={ano:tAno(r),mes:tMes(r),i:0,e:0};
    if(tTipo(r)==='Ingreso') m[k].i+=tImp(r); else m[k].e+=Math.abs(tImp(r));
  });
  var mo=Object.values(m).sort(function(a,b){return a.ano!==b.ano?a.ano-b.ano:a.mes-b.mes;});

  // Cap outliers: mediana * 2.5
  var allVals=[];
  mo.forEach(function(x){allVals.push(x.i,x.e);});
  allVals=allVals.filter(function(v){return v>0;}).sort(function(a,b){return a-b;});
  var median=allVals[Math.floor(allVals.length/2)];
  var cap=median*2.5;
  var maxNormal=0;
  allVals.forEach(function(v){if(v<=cap&&v>maxNormal) maxNormal=v;});
  var yMax=maxNormal*1.2;

  var iData=mo.map(function(x){return Math.round(x.i);});
  var eData=mo.map(function(x){return Math.round(x.e);});
  var bData=mo.map(function(x){return Math.round(x.i-x.e);});
  var iClip=iData.map(function(v){return Math.min(v,yMax);});
  var eClip=eData.map(function(v){return Math.min(v,yMax);});
  var bMin=Math.min.apply(null,bData);

  var labels=mo.map(function(x){return MN[x.mes]+' '+String(x.ano).slice(2);});

  CHS.tend=new Chart(document.getElementById('cTend').getContext('2d'),{
    type:'line',
    data:{labels:labels,datasets:[
      {label:'Ingresos',data:iClip,borderColor:'#4D9FFF',backgroundColor:'rgba(77,159,255,0.06)',
       pointBackgroundColor:iData.map(function(v){return v>yMax?'#FFB547':'#4D9FFF';}),
       borderWidth:2,tension:0.3,pointRadius:3,pointHoverRadius:5},
      {label:'Egresos',data:eClip,borderColor:'#FF4D6A',backgroundColor:'rgba(255,77,106,0.06)',
       pointBackgroundColor:eData.map(function(v){return v>yMax?'#FFB547':'#FF4D6A';}),
       borderWidth:2,tension:0.3,pointRadius:3,pointHoverRadius:5,borderDash:[5,3]},
      {label:'Balance',data:bData,borderColor:'#00C48C',backgroundColor:'rgba(0,196,140,0.06)',
       pointBackgroundColor:'#00C48C',borderWidth:2,tension:0.3,pointRadius:3,pointHoverRadius:5,borderDash:[2,4]}
    ]},
    options:{
      responsive:true,maintainAspectRatio:false,
      plugins:{
        legend:{display:false},
        tooltip:{backgroundColor:'#161b27',titleColor:'#94a3b8',bodyColor:'#e2e8f0',callbacks:{
          label:function(c){
            var ds=c.datasetIndex;
            var real=ds===0?iData[c.dataIndex]:ds===1?eData[c.dataIndex]:bData[c.dataIndex];
            var lbl=['Ingresos','Egresos','Balance'][ds];
            return lbl+': '+fmt(real)+(real>yMax?' (fuera escala)':'');
          }
        }}
      },
      scales:{
        x:{ticks:{color:'#64748b',font:{size:8},maxRotation:45,autoSkip:false},grid:{color:'#1e2535'}},
        y:{min:bMin<0?bMin*1.1:0,max:yMax,
           ticks:{color:'#64748b',font:{size:8},callback:function(v){return fmt(v);},maxTicksLimit:6},
           grid:{color:'#1e2535'}}
      }
    },
    plugins:[{
      id:'outlierFlag',
      afterDatasetsDraw:function(chart){
        var ctx=chart.ctx, scales=chart.scales;
        [[iData,'#4D9FFF'],[eData,'#FF4D6A']].forEach(function(pair,di){
          pair[0].forEach(function(v,i){
            if(v>yMax){
              var meta=chart.getDatasetMeta(di);
              var pt=meta.data[i]; if(!pt) return;
              ctx.save();
              ctx.fillStyle=pair[1];
              ctx.beginPath();ctx.moveTo(pt.x,scales.y.top+2);ctx.lineTo(pt.x-5,scales.y.top+10);ctx.lineTo(pt.x+5,scales.y.top+10);ctx.closePath();ctx.fill();
              ctx.font='bold 7px system-ui';ctx.textAlign='center';ctx.textBaseline='top';
              ctx.fillText(fmt(v),pt.x,scales.y.top+12);
              ctx.restore();
            }
          });
        });
      }
    }]
  });

  var h='';
  [['Ingresos','#4D9FFF'],['Egresos','#FF4D6A'],['Balance','#00C48C']].forEach(function(p){
    h+='<span style="display:flex;align-items:center;gap:3px"><span style="width:12px;height:2px;background:'+p[1]+';display:inline-block"></span>'+p[0]+'</span>';
  });
  document.getElementById('legTend').innerHTML=h;
}

function buildPersona(tx){
  var byPN={};
  PERS.forEach(function(p){byPN[p]={};});
  tx.forEach(function(r){
    if(tTipo(r)==='Egreso'&&byPN[tNom(r)]!==undefined)
      byPN[tNom(r)][tR2(r)]=(byPN[tNom(r)][tR2(r)]||0)+Math.abs(tImp(r));
  });
  // Total por persona
  var totByP={};
  PERS.forEach(function(p){totByP[p]=Object.values(byPN[p]).reduce(function(s,v){return s+v;},0);});
  var persOrd=PERS.slice().sort(function(a,b){return totByP[b]-totByP[a];});
  // Total por rubro
  var totByR={};
  RUBS.forEach(function(rub){totByR[rub]=PERS.reduce(function(s,p){return s+(byPN[p][rub]||0);},0);});
  var rubsOrd=RUBS.slice().sort(function(a,b){return totByR[b]-totByR[a];});

  var h=persOrd.length*44+70;
  var pw=document.getElementById('pWrap'); pw.style.position='relative'; pw.style.height=h+'px';
  CHS.per=new Chart(document.getElementById('cPer').getContext('2d'),{
    type:'bar',
    data:{
      labels:persOrd,
      datasets:rubsOrd.map(function(rub){return{
        label:rub,
        data:persOrd.map(function(p){return Math.round(byPN[p][rub]||0);}),
        backgroundColor:RC[rub]||'#888',borderRadius:2
      };})
    },
    options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,
      plugins:{legend:{display:false},tooltip:{backgroundColor:'#161b27',titleColor:'#64748b',bodyColor:'#e2e8f0',
        callbacks:{label:function(c){return c.dataset.label+': '+fmt(c.parsed.x);}}}},
      scales:{
        x:{stacked:true,ticks:{color:'#64748b',font:{size:8},callback:function(v){return fmt(v);}},grid:{color:'#1e2535'}},
        y:{stacked:true,ticks:{color:'#94a3b8',font:{size:10}},grid:{display:false}}
      }
    }
  });
}

function buildTabla(tx,pp){
  // Árbol real: r2 -> r1 -> nom -> desc -> total
  var tree={};
  tx.forEach(function(r){
    if(tTipo(r)!=='Egreso') return;
    var r2=tR2(r),r1=tR1(r),nom=tNom(r),desc=tDesc(r)||'(sin descripci\u00f3n)',v=Math.abs(tImp(r));
    if(!tree[r2]) tree[r2]={total:0,r1s:{}};
    tree[r2].total+=v;
    if(!tree[r2].r1s[r1]) tree[r2].r1s[r1]={total:0,noms:{}};
    tree[r2].r1s[r1].total+=v;
    if(!tree[r2].r1s[r1].noms[nom]) tree[r2].r1s[r1].noms[nom]={total:0,descs:{}};
    tree[r2].r1s[r1].noms[nom].total+=v;
    tree[r2].r1s[r1].noms[nom].descs[desc]=(tree[r2].r1s[r1].noms[nom].descs[desc]||0)+v;
  });

  // Árbol presupuesto: r2 -> r1
  var ppT={};
  pp.forEach(function(r){
    if(tTipo(r)!=='Egreso'||tImp(r)===0) return;
    var r2=tR2(r),r1=tR1(r),v=Math.abs(tImp(r));
    if(!ppT[r2]) ppT[r2]={total:0,r1s:{}};
    ppT[r2].total+=v;
    if(!ppT[r2].r1s[r1]) ppT[r2].r1s[r1]={total:0};
    ppT[r2].r1s[r1].total+=v;
  });

  var allR2=Object.keys(Object.assign({},tree,ppT)).sort();
  // Estado expansión: usamos índices numéricos simples
  var expR2={},expR1={},expNom={};
  allR2.forEach(function(r2){expR2[r2]=false;});

  function draw(){
    var tb=document.getElementById('tblB'); if(!tb) return;
    var h='';
    allR2.forEach(function(r2){
      var rT=tree[r2]?tree[r2].total:0;
      var pT=ppT[r2]?ppT[r2].total:0;
      var diff=rT-pT, pct=pT>0?Math.round(rT/pT*100):null;
      var dc=diff>0?'#FF4D6A':'#00C48C';
      var pc=pct!=null?(pct>100?'#FF4D6A':pct>85?'#FFB547':'#00C48C'):'#64748b';
      var rid='R2_'+allR2.indexOf(r2);
      h+='<tr class="tr2" onclick="toggle(\''+rid+'\')">';
      h+='<td><button class="tog">'+(expR2[r2]?'&#x25BC;':'&#x25B6;')+'</button>'+esc(r2)+'</td>';
      h+='<td>'+fmt(rT)+'</td>';
      h+='<td style="color:#94a3b8">'+(pT>0?fmt(pT):'&#x2014;')+'</td>';
      h+='<td style="color:'+dc+'">'+(pT>0?(diff>0?'+':'')+fmt(diff):'&#x2014;')+'</td>';
      h+='<td style="color:'+pc+'">'+(pct!=null?pct+'%':'&#x2014;')+'</td></tr>';

      if(!expR2[r2]) return;

      var r1s=tree[r2]?Object.keys(tree[r2].r1s).sort():[];
      r1s.forEach(function(r1){
        var k1=r2+'|'+r1;
        if(expR1[k1]===undefined) expR1[k1]=false;
        var rT1=tree[r2].r1s[r1].total;
        var pT1=ppT[r2]&&ppT[r2].r1s[r1]?ppT[r2].r1s[r1].total:0;
        var d1=rT1-pT1,p1=pT1>0?Math.round(rT1/pT1*100):null;
        var dc1=d1>0?'#FF4D6A':'#00C48C',pc1=p1!=null?(p1>100?'#FF4D6A':p1>85?'#FFB547':'#00C48C'):'#64748b';
        var r1idx=r1s.indexOf(r1);
        var r1id='R1_'+allR2.indexOf(r2)+'_'+r1idx;
        h+='<tr class="tr1" onclick="toggle(\''+r1id+'\')">';
        h+='<td style="padding-left:20px"><button class="tog">'+(expR1[k1]?'&#x25BC;':'&#x25B6;')+'</button>'+esc(r1)+'</td>';
        h+='<td>'+fmt(rT1)+'</td>';
        h+='<td style="color:#64748b">'+(pT1>0?fmt(pT1):'&#x2014;')+'</td>';
        h+='<td style="color:'+dc1+'">'+(pT1>0?(d1>0?'+':'')+fmt(d1):'&#x2014;')+'</td>';
        h+='<td style="color:'+pc1+'">'+(p1!=null?p1+'%':'&#x2014;')+'</td></tr>';

        if(!expR1[k1]) return;
        var noms=Object.keys(tree[r2].r1s[r1].noms).sort();
        noms.forEach(function(nom){
          var kn=r2+'|'+r1+'|'+nom;
          if(expNom[kn]===undefined) expNom[kn]=false;
          var rTN=tree[r2].r1s[r1].noms[nom].total;
          var nomIdx=noms.indexOf(nom);
          var nomId='NOM_'+allR2.indexOf(r2)+'_'+r1idx+'_'+nomIdx;
          h+='<tr class="trp" onclick="toggle(\''+nomId+'\')">';
          h+='<td style="padding-left:38px"><button class="tog">'+(expNom[kn]?'&#x25BC;':'&#x25B6;')+'</button>&#x1F464; '+esc(nom)+'</td>';
          h+='<td>'+fmt(rTN)+'</td><td style="color:#64748b">&#x2014;</td><td>&#x2014;</td><td>&#x2014;</td></tr>';

          if(!expNom[kn]) return;
          var descs=Object.entries(tree[r2].r1s[r1].noms[nom].descs).sort(function(a,b){return b[1]-a[1];});
          descs.forEach(function(de){
            h+='<tr class="trd"><td style="padding-left:56px">&#x2514; '+esc(de[0])+'</td>';
            h+='<td>'+fmt(de[1])+'</td><td style="color:#64748b">&#x2014;</td><td>&#x2014;</td><td>&#x2014;</td></tr>';
          });
        });
      });
    });
    tb.innerHTML=h||'<tr><td colspan="5" style="text-align:center;color:#64748b;padding:12px">Sin datos</td></tr>';
  }

  // Toggle usando IDs numéricos simples
  window.toggle=function(id){
    if(id.indexOf('R2_')===0){
      var idx=+id.slice(3); var r2=allR2[idx]; expR2[r2]=!expR2[r2];
    } else if(id.indexOf('R1_')===0){
      var parts=id.slice(3).split('_'); var r2=allR2[+parts[0]];
      var r1=Object.keys(tree[r2].r1s).sort()[+parts[1]];
      var k1=r2+'|'+r1; if(expR1[k1]===undefined) expR1[k1]=false; expR1[k1]=!expR1[k1];
    } else if(id.indexOf('NOM_')===0){
      var parts=id.slice(4).split('_'); var r2=allR2[+parts[0]];
      var r1=Object.keys(tree[r2].r1s).sort()[+parts[1]];
      var nom=Object.keys(tree[r2].r1s[r1].noms).sort()[+parts[2]];
      var kn=r2+'|'+r1+'|'+nom; if(expNom[kn]===undefined) expNom[kn]=false; expNom[kn]=!expNom[kn];
    }
    draw();
  };
  draw();
}

initFilters();
render();
</script>
