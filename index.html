<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0">
<meta name="theme-color" content="#0d1117">
<title>Dashboard Finanzas</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>

*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0d1117;--card:#161b27;--border:#2d3748;--text:#e2e8f0;
  --muted:#64748b;--sub:#94a3b8;--accent:#4D9FFF;
  --green:#00C48C;--red:#FF4D6A;--yellow:#FFB547;--purple:#9B59B6;
}
body{background:var(--bg);color:var(--text);font-family:system-ui,sans-serif;min-height:100vh}
.dash{padding:10px;max-width:1400px;margin:0 auto}
.topbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;
  background:var(--card);border:1px solid var(--border);border-radius:10px;
  padding:8px 12px;margin-bottom:10px}
.topbar-title{font-size:13px;font-weight:600;color:var(--accent);margin-right:6px;white-space:nowrap}
.filter-group{display:flex;align-items:center;gap:4px}
.filter-group label{font-size:10px;color:var(--muted);white-space:nowrap}
.filter-group select{background:var(--bg);color:var(--text);border:1px solid var(--border);
  border-radius:6px;padding:4px 6px;font-size:11px;cursor:pointer;max-width:120px}
.badge{margin-left:auto;font-size:9px;color:var(--accent);white-space:nowrap}
.btn-refresh{background:#1e3a5f;color:var(--accent);border:1px solid var(--accent);
  border-radius:6px;padding:4px 10px;font-size:11px;cursor:pointer;white-space:nowrap;
  display:flex;align-items:center;gap:4px;transition:background .2s}
.btn-refresh:hover{background:#2563eb;color:#fff}
.btn-refresh.loading{opacity:.6;cursor:not-allowed}
.sec{font-size:9px;text-transform:uppercase;letter-spacing:1.2px;color:var(--accent);margin-bottom:8px;font-weight:600}
.kpi-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:10px}
.kpi{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px;position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;top:0;left:0;right:0;height:2px;border-radius:2px 2px 0 0}
.kpi.ki::before{background:var(--green)}.kpi.ke::before{background:var(--red)}
.kpi.kb::before{background:var(--accent)}.kpi.kac::before{background:var(--purple)}
.kpi.kr::before{background:var(--yellow)}
.kl{font-size:10px;color:var(--muted);margin-bottom:4px}
.kv{font-size:18px;font-weight:500;line-height:1.2;margin-bottom:3px}
.kv-big{font-size:24px;font-weight:600;line-height:1.1;margin-bottom:2px}
.kp{font-size:10px;color:var(--sub);margin-bottom:2px;display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.kpsmall{font-size:9px;color:var(--muted)}
.kdelta{font-size:9px;margin-top:2px}
.knote{font-size:9px;color:var(--muted);margin-top:3px}
.pos{color:var(--green)}.neg{color:var(--red)}
.card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px}
.mid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.donut-wrap{display:grid;grid-template-columns:160px 1fr;gap:10px;align-items:center}
.leg-row{display:flex;align-items:center;gap:4px;margin-bottom:3px;font-size:9px}
.leg-dot{width:7px;height:7px;border-radius:2px;flex-shrink:0}
.leg-name{color:var(--sub);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.leg-pct{color:#cbd5e1;min-width:26px;text-align:right}
.leg-amt{color:var(--muted);min-width:58px;text-align:right;font-size:8px}
.sm-row{margin-bottom:7px}.sm-row:last-child{margin-bottom:0}
.sm-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:2px}
.sm-name{font-size:10px;color:#cbd5e1}.sm-pct{font-size:9px;font-weight:500}
.sm-bar{height:5px;background:var(--border);border-radius:2px;overflow:hidden;margin-bottom:2px}
.sm-fill{height:100%;border-radius:2px}
.sm-det{font-size:9px;color:var(--muted);display:flex;justify-content:space-between}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.full{margin-bottom:10px}
.pwrap{position:relative}
.tscroll{overflow-x:auto;margin-top:4px;-webkit-overflow-scrolling:touch}
table.rt{width:100%;border-collapse:collapse;font-size:11px;table-layout:fixed}
table.rt th{color:var(--muted);font-weight:400;padding:6px 8px;text-align:right;border-bottom:1px solid var(--border);white-space:nowrap}
table.rt th:first-child{text-align:left}
table.rt td{padding:5px 8px;border-bottom:.5px solid var(--bg);text-align:right;color:var(--sub);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;transition:background .12s,color .12s}
table.rt td:first-child{text-align:left;white-space:normal;word-break:break-word}
table.rt .tr2 td{color:var(--text);font-weight:500;background:#1a2035;cursor:pointer}
table.rt .tr2:hover td{background:#253354;color:#fff}
table.rt .tr1 td{font-size:10px;cursor:pointer}
table.rt .tr1 td:first-child{padding-left:18px;color:#cbd5e1}
table.rt .tr1:hover td{background:#1e2a45;color:var(--text)}
table.rt .tr1:hover td:first-child{border-left:3px solid var(--green);padding-left:15px}
table.rt .tr1:hover td:nth-child(2){color:#fff;font-weight:500}
table.rt .trp td{font-size:10px;cursor:pointer}
table.rt .trp td:first-child{padding-left:34px;color:var(--sub)}
table.rt .trp:hover td{background:#192238;color:#cbd5e1}
table.rt .trp:hover td:first-child{border-left:3px solid var(--yellow);padding-left:31px}
table.rt .trp:hover td:nth-child(2){color:#fff;font-weight:500}
table.rt .trd td{font-size:9px;cursor:default}
table.rt .trd td:first-child{padding-left:50px;color:var(--muted)}
table.rt .trd:hover td{background:#141c2e;color:var(--sub)}
table.rt .trd:hover td:first-child{border-left:3px solid var(--accent);padding-left:47px;color:#a0aec0}
table.rt .trd:hover td:nth-child(2){color:#fff;font-weight:500}
.tog{background:none;border:none;color:var(--accent);cursor:pointer;font-size:9px;margin-right:3px;padding:0;vertical-align:middle}
/* Loading overlay */
.loading-screen{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;
  align-items:center;justify-content:center;z-index:999;gap:16px}
.spinner{width:40px;height:40px;border:3px solid var(--border);border-top-color:var(--accent);
  border-radius:50%;animation:spin 0.8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.load-msg{font-size:13px;color:var(--sub)}
.load-sub{font-size:10px;color:var(--muted)}
.error-box{background:#1a0a0a;border:1px solid var(--red);border-radius:10px;padding:20px;
  max-width:480px;text-align:center;margin:20px auto}
.error-box h3{color:var(--red);margin-bottom:8px;font-size:14px}
.error-box p{font-size:11px;color:var(--sub);line-height:1.6}
.error-box a{color:var(--accent);text-decoration:none}
.error-box code{background:#0d1117;border-radius:4px;padding:2px 5px;font-size:10px;color:var(--yellow)}
/* Responsive */
@media(max-width:900px){
  .kpi-grid{grid-template-columns:repeat(3,1fr)}
  .mid{grid-template-columns:1fr}
  .two{grid-template-columns:1fr}
  .donut-wrap{grid-template-columns:140px 1fr}
  .kv{font-size:16px}.kv-big{font-size:22px}
}
@media(max-width:600px){
  .dash{padding:6px}
  .topbar{padding:6px 8px;gap:5px}
  .topbar-title{font-size:12px}
  .filter-group select{font-size:10px;padding:3px 5px;max-width:90px}
  .kpi-grid{grid-template-columns:repeat(2,1fr);gap:6px}
  .kpi{padding:10px}.kv{font-size:15px}.kv-big{font-size:20px}.kl{font-size:9px}
  .card{padding:10px}
  .donut-wrap{grid-template-columns:1fr;justify-items:center}
  table.rt{font-size:10px}
  table.rt th,table.rt td{padding:4px 5px}
}
@media(max-width:380px){
  .kpi-grid{grid-template-columns:1fr 1fr}
  .kpi{padding:8px}.kv{font-size:14px}.kv-big{font-size:18px}
  .filter-group label{display:none}
  .filter-group select{max-width:80px}
  .badge{display:none}
}

</style>
</head>
<body>

<div id="loading-screen" class="loading-screen">
  <div class="spinner"></div>
  <div class="load-msg" id="load-msg">Conectando con Google Sheets&#x2026;</div>
  <div class="load-sub" id="load-sub">Descargando transacciones</div>
</div>
<div class="dash">
<div class="topbar">
  <span class="topbar-title">&#x1F4B0; Finanzas Familiares</span>
  <div class="filter-group"><label>A&#xF1;o</label><select id="sA" onchange="onAnoChange()"></select></div>
  <div class="filter-group"><label>Mes</label><select id="sM" onchange="render()"></select></div>
  <div class="filter-group"><label>Persona</label>
    <select id="sN" onchange="render()">
      <option value="">Todos</option><option>Miguel</option><option>Familia</option>
      <option>Andr&#xE9;</option><option>Alessia</option><option>Lissette</option><option>Mam&#xE1;</option>
    </select></div>
  <div class="filter-group"><label>Tipo</label>
    <select id="sT" onchange="render()">
      <option value="">Ambos</option><option value="Ingreso">Ingreso</option><option value="Egreso">Egreso</option>
    </select></div>
  <button class="btn-refresh" id="btnRefresh" onclick="loadData(false)">&#x21BB; Actualizar</button>
  <span class="badge" id="badge">Cargando&#x2026;</span>
</div>
<div id="app"></div>
</div>
<script>

// ── CONFIG ──────────────────────────────────────────────────────────────────
var SHEET_ID = '1hQpCe36CfZZ9eWLPJIaIQOGNG9VHnoDmu6KBixQVReE';
var GID_TX   = '1368081138';
var GID_PP   = '254156118';
var GID_SN   = '2057804659';

function csvURL(gid){
  return 'https://docs.google.com/spreadsheets/d/'+SHEET_ID+'/export?format=csv&gid='+gid+'&t='+Date.now();
}

// ── GLOBALS ──────────────────────────────────────────────────────────────────
var TX=[], PP=[], SALDO=[], CHS={};
var MN=['','Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
var RC={
  'Alimentaci\u00f3n':'#4D9FFF','Gastos Adicional':'#FF4D6A','Recreaci\u00f3n':'#FFB547',
  'Vestimenta':'#9B59B6','Educaci\u00f3n':'#00C48C','Transporte':'#E67E22',
  'Salud':'#E74C3C','Servicios':'#1ABC9C','Hogar':'#F39C12',
  'Prestamos entregados':'#95A5A6','Beneficios sociales':'#3498DB',
  'Salario extra':'#2ECC71','Prestamos devueltos':'#27AE60',
  'Ingresos extras':'#16A085','Salario':'#2980B9'
};
var PERS=['Miguel','Familia','Andr\u00e9','Alessia','Lissette','Mam\u00e1'];
var RUBS=['Alimentaci\u00f3n','Recreaci\u00f3n','Educaci\u00f3n','Vestimenta','Salud','Transporte','Gastos Adicional','Servicios','Hogar'];

// ── HELPERS ──────────────────────────────────────────────────────────────────
function tMes(r){return r[0];}function tAno(r){return r[1];}function tImp(r){return r[2];}
function tR1(r){return r[3];}function tR2(r){return r[4];}function tTipo(r){return r[5];}
function tNom(r){return r[6];}function tDesc(r){return r[7]||'';}
function fmt(n){return 'S/\u00a0'+Math.round(n).toLocaleString('es-PE');}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function trim(s){return String(s||'').trim();}
function pNum(s){var n=parseFloat(String(s).replace(',','.'));return isNaN(n)?0:n;}

// ── CSV PARSER (sin PapaParse) ────────────────────────────────────────────────
function parseCSV(text){
  var rows=[], lines=text.split('\n');
  for(var i=0;i<lines.length;i++){
    var line=lines[i].replace(/\r$/,'');
    if(!line.trim())continue;
    var row=[],cur='',inQ=false;
    for(var j=0;j<line.length;j++){
      var ch=line[j];
      if(ch==='"'){
        if(inQ&&line[j+1]==='"'){cur+='"';j++;}
        else inQ=!inQ;
      } else if(ch===','&&!inQ){row.push(cur);cur='';} 
      else cur+=ch;
    }
    row.push(cur);
    rows.push(row);
  }
  return rows;
}

function fetchCSV(gid){
  return fetch(csvURL(gid)).then(function(r){
    if(!r.ok) throw new Error('HTTP '+r.status+' al cargar hoja gid='+gid);
    return r.text();
  });
}

// ── PARSE TRANSACCIONES ───────────────────────────────────────────────────────
// Cols: Fecha,Mes,Año,Concatenar,Descripción,Importe,Rubro 1,Rubro 2,Tipo,Nombre
function parseTX(text){
  var rows=parseCSV(text), out=[];
  for(var i=1;i<rows.length;i++){
    var r=rows[i];
    if(r.length<10)continue;
    var mes=parseInt(r[1]),ano=parseInt(r[2]),imp=pNum(r[5]);
    if(!mes||!ano||imp===0)continue;
    out.push([mes,ano,imp,trim(r[6]),trim(r[7]),trim(r[8]),trim(r[9]),trim(r[4])]);
  }
  return out;
}

// ── PARSE PRESUPUESTO ─────────────────────────────────────────────────────────
// Cols: fecha,Mes,Año,Concatenar,Rubro 1,Rubro 2,Tipo,Importe,Nombre
function parsePP(text){
  var rows=parseCSV(text), out=[];
  for(var i=1;i<rows.length;i++){
    var r=rows[i];
    if(r.length<9)continue;
    var mes=parseInt(r[1]),ano=parseInt(r[2]),imp=pNum(r[7]);
    if(!mes||!ano||imp===0)continue;
    out.push([mes,ano,imp,trim(r[4]),trim(r[5]),trim(r[6]),trim(r[8])]);
  }
  return out;
}

// ── PARSE SALDO NETO ──────────────────────────────────────────────────────────
// Cols: Fecha,Mes2,Año,Concatenar,Saldo Mes,Saldo Ppto,Saldo Neto,Saldo Neto ppto
function parseSN(text){
  var rows=parseCSV(text), out=[];
  for(var i=1;i<rows.length;i++){
    var r=rows[i];
    if(r.length<8)continue;
    var mes=parseInt(r[1]),ano=parseInt(r[2]);
    var sReal=pNum(r[6]),sPpto=pNum(r[7]);
    if(!mes||!ano||sReal===0)continue;
    out.push([mes,ano,sReal,sPpto]);
  }
  return out;
}

// ── LOAD DATA ─────────────────────────────────────────────────────────────────
function setLoading(msg,sub){
  document.getElementById('load-msg').textContent=msg;
  document.getElementById('load-sub').textContent=sub||'';
}

function showError(title,msg){
  document.getElementById('loading-screen').style.display='none';
  document.getElementById('app').innerHTML=
    '<div class="error-box"><h3>'+title+'</h3><p>'+msg+'</p></div>';
}

function loadData(silent){
  var btn=document.getElementById('btnRefresh');
  if(btn){btn.classList.add('loading');btn.disabled=true;}
  if(!silent){
    document.getElementById('loading-screen').style.display='flex';
    setLoading('Conectando con Google Sheets\u2026','Descargando transacciones');
  }
  return fetchCSV(GID_TX)
    .then(function(t){
      TX=parseTX(t);
      if(!silent) setLoading('Leyendo presupuesto\u2026','');
      return fetchCSV(GID_PP);
    })
    .then(function(t){
      PP=parsePP(t);
      if(!silent) setLoading('Leyendo saldo neto\u2026','');
      return fetchCSV(GID_SN);
    })
    .then(function(t){
      SALDO=parseSN(t);
      document.getElementById('loading-screen').style.display='none';
      if(btn){btn.classList.remove('loading');btn.disabled=false;}
      var ts=new Date().toLocaleTimeString('es-PE',{hour:'2-digit',minute:'2-digit'});
      var badge=document.getElementById('badge');
      if(badge) badge.textContent=TX.length+' tx \u00b7 '+ts;
      initFilters();
      render();
    })
    .catch(function(err){
      if(btn){btn.classList.remove('loading');btn.disabled=false;}
      if(silent){
        console.warn('Silent refresh failed:',err);
      } else {
        showError('Error al cargar datos',
          'No se pudo leer Google Sheets.<br><br>'+
          'Verifica que la hoja sea p\u00fablica:<br>'+
          '<b>Archivo \u2192 Compartir \u2192 Cualquier persona con el enlace \u2192 Lector</b><br><br>'+
          'Error: <code>'+esc(err.message)+'</code>');
      }
    });
}

// ── FILTROS ───────────────────────────────────────────────────────────────────
function getF(){
  return{ano:document.getElementById('sA').value,mes:document.getElementById('sM').value,
    nom:document.getElementById('sN').value,tipo:document.getElementById('sT').value};
}
function filtTX(f){
  return TX.filter(function(r){
    if(f.ano&&tAno(r)!=+f.ano)return false;
    if(f.mes&&tMes(r)!=+f.mes)return false;
    if(f.nom&&tNom(r)!==f.nom)return false;
    if(f.tipo&&tTipo(r)!==f.tipo)return false;
    return true;
  });
}
function filtPP(f){
  return PP.filter(function(r){
    if(f.ano&&tAno(r)!=+f.ano)return false;
    if(f.mes&&tMes(r)!=+f.mes)return false;
    return true;
  });
}
function getPrev(f){
  if(!f.mes||!f.ano)return null;
  var pm=+f.mes-1,pa=+f.ano;
  if(pm<1){pm=12;pa--;}
  return TX.filter(function(r){return tAno(r)===pa&&tMes(r)===pm&&(!f.nom||tNom(r)===f.nom);});
}
function sum(data){
  var i=0,e=0;
  data.forEach(function(r){if(tTipo(r)==='Ingreso')i+=tImp(r);else e+=Math.abs(tImp(r));});
  return{i:i,e:e,b:i-e};
}
function getSaldo(f){
  if(!f.mes||!f.ano){
    if(!SALDO.length)return{real:0,ppto:0};
    var l=SALDO[SALDO.length-1];return{real:l[2],ppto:l[3]};
  }
  for(var i=0;i<SALDO.length;i++){if(SALDO[i][0]==+f.mes&&SALDO[i][1]==+f.ano)return{real:SALDO[i][2],ppto:SALDO[i][3]};}
  var best=null;
  SALDO.forEach(function(s){if(s[1]<+f.ano||(s[1]==+f.ano&&s[0]<=+f.mes))best=s;});
  return best?{real:best[2],ppto:best[3]}:{real:0,ppto:0};
}
function initFilters(){
  var anos=[];TX.forEach(function(r){if(anos.indexOf(tAno(r))<0)anos.push(tAno(r));});anos.sort();
  var sA=document.getElementById('sA');
  sA.innerHTML=anos.map(function(a){return'<option value="'+a+'">'+a+'</option>';}).join('');
  sA.value=anos.indexOf(2026)>=0?2026:anos[anos.length-1];
  updateMeses();
}
function onAnoChange(){updateMeses();render();}
function updateMeses(){
  var ano=+document.getElementById('sA').value;
  var meses=[];TX.forEach(function(r){if(tAno(r)===ano&&meses.indexOf(tMes(r))<0)meses.push(tMes(r));});
  meses.sort(function(a,b){return a-b;});
  var sM=document.getElementById('sM'),prev=+sM.value;
  sM.innerHTML='<option value="">Todos</option>'+meses.map(function(m){return'<option value="'+m+'">'+MN[m]+'</option>';}).join('');
  if(meses.indexOf(prev)>=0)sM.value=prev;
  else{var last=meses[meses.length-1];if(last)sM.value=last;}
}
function destroyAll(){Object.keys(CHS).forEach(function(k){try{CHS[k].destroy();}catch(e){}});CHS={};}

// ── RENDER ────────────────────────────────────────────────────────────────────
function pptoBadge(real,ppto,invert){
  if(!ppto)return'';
  var d=real-ppto,pct=Math.round(Math.abs(d)/ppto*100);
  var ok=invert?(real<=ppto):(real>=ppto);
  return'<span class="'+(ok?'pos':'neg')+'">'+(ok?'&#x2713;':(d>0?'+':'-'))+pct+'%</span>';
}
function deltaLine(real,ref){
  if(ref==null||ref===undefined)return'';
  var d=real-ref,cls=d>=0?'pos':'neg',arrow=d>=0?'&#x25B2;':'&#x25BC;';
  return'<div class="kdelta '+cls+'">'+arrow+' '+fmt(Math.abs(d))+' vs mes ant.</div>';
}

function render(){
  destroyAll();
  var f=getF(),tx=filtTX(f),pp=filtPP(f),prev=getPrev(f);
  var s=sum(tx),i=s.i,e=s.e,b=s.b;
  var pi=0,pe=0;
  pp.forEach(function(r){if(tTipo(r)==='Ingreso')pi+=Math.abs(tImp(r));else pe+=Math.abs(tImp(r));});
  var pb=pi-pe,ps=prev?sum(prev):null,saldo=getSaldo(f);
  var ratio=i>0?Math.round(b/i*100):0;
  var pbRatio=pi>0?Math.round(pb/pi*100):0;
  var ratioCol=ratio>=20?'#00C48C':ratio>=10?'#FFB547':'#FF4D6A';
  var ratioLbl=ratio>=20?'&#x2713; Saludable':ratio>=10?'&#x26A0; Moderado':'&#x2717; Por mejorar';
  var bCol=b>=0?'#00C48C':'#FF4D6A';

  var h='';
  h+='<div class="sec">Indicadores del per\u00edodo</div><div class="kpi-grid">';
  h+='<div class="kpi ki"><div class="kl">Ingresos</div><div class="kv pos">'+fmt(i)+'</div>';

function buildSemaforo(tx,pp){
  var rM={},pM={};
  tx.forEach(function(r){if(tTipo(r)==='Egreso')rM[tR2(r)]=(rM[tR2(r)]||0)+Math.abs(tImp(r));});
  pp.forEach(function(r){if(tTipo(r)==='Egreso'&&tImp(r)!==0)pM[tR2(r)]=(pM[tR2(r)]||0)+Math.abs(tImp(r));});
  var rows=Object.keys(pM).filter(function(k){return pM[k]>0;}).map(function(k){
    return{k:k,r:rM[k]||0,p:pM[k],pct:(rM[k]||0)/pM[k]*100};
  }).sort(function(a,b){return b.pct-a.pct;});
  if(!rows.length){document.getElementById('sem').innerHTML='<div style="font-size:10px;color:#64748b;padding:8px">Sin presupuesto para este per\u00edodo</div>';return;}
  var h='';
  rows.forEach(function(x){
    var col=x.pct<85?'#00C48C':x.pct<100?'#FFB547':'#FF4D6A';
    var w=Math.min(100,x.pct),dev=x.r-x.p;
    h+='<div class="sm-row"><div class="sm-hdr"><span class="sm-name">'+esc(x.k)+'</span><span class="sm-pct" style="color:'+col+'">'+Math.round(x.pct)+'%</span></div>';
    h+='<div class="sm-bar"><div class="sm-fill" style="width:'+w+'%;background:'+col+'"></div></div>';
    h+='<div class="sm-det"><span>'+fmt(x.r)+' / '+fmt(x.p)+'</span><span style="color:'+(dev>0?'#FF4D6A':'#00C48C')+'">'+(dev>0?'+':'')+fmt(dev)+'</span></div></div>';
  });
  document.getElementById('sem').innerHTML=h;
}

function buildTendencia(){
  var m={};
  TX.forEach(function(r){
    if(tImp(r)===0)return;if(tAno(r)===2025&&tMes(r)<7)return;
    var k=tAno(r)+'-'+(tMes(r)<10?'0':'')+tMes(r);
    if(!m[k])m[k]={ano:tAno(r),mes:tMes(r),i:0,e:0};
    if(tTipo(r)==='Ingreso')m[k].i+=tImp(r);else m[k].e+=Math.abs(tImp(r));
  });
  var mo=Object.values(m).sort(function(a,b){return a.ano!==b.ano?a.ano-b.ano:a.mes-b.mes;});
  var allVals=[];mo.forEach(function(x){allVals.push(x.i,x.e);});
  allVals=allVals.filter(function(v){return v>0;}).sort(function(a,b){return a-b;});
  var median=allVals[Math.floor(allVals.length/2)],cap=median*2.5,maxN=0;

  var iClip=iData.map(function(v){return Math.min(v,yMax);});

    type:'line',
    data:{labels:mo.map(function(x){return MN[x.mes]+' '+String(x.ano).slice(2);}),datasets:[
      {label:'Ingresos',data:iClip,borderColor:'#4D9FFF',backgroundColor:'rgba(77,159,255,0.06)',
       pointBackgroundColor:iData.map(function(v){return v>yMax?'#FFB547':'#4D9FFF';}),
       borderWidth:2,tension:0.3,pointRadius:isBig?3:2,pointHoverRadius:5},
      {label:'Egresos',data:eClip,borderColor:'#FF4D6A',backgroundColor:'rgba(255,77,106,0.06)',
       pointBackgroundColor:eData.map(function(v){return v>yMax?'#FFB547':'#FF4D6A';}),
       borderWidth:2,tension:0.3,pointRadius:isBig?3:2,pointHoverRadius:5,borderDash:[5,3]},
      {label:'Balance',data:bData,borderColor:'#00C48C',backgroundColor:'rgba(0,196,140,0.06)',
       pointBackgroundColor:'#00C48C',borderWidth:2,tension:0.3,pointRadius:isBig?3:2,pointHoverRadius:5,borderDash:[2,4]}
    ]},
    options:{responsive:true,maintainAspectRatio:false,
      plugins:{legend:{display:false},tooltip:{backgroundColor:'#161b27',titleColor:'#94a3b8',bodyColor:'#e2e8f0',
        callbacks:{label:function(c){var ds=c.datasetIndex;var real=ds===0?iData[c.dataIndex]:ds===1?eData[c.dataIndex]:bData[c.dataIndex];
          return['Ingresos','Egresos','Balance'][ds]+': '+fmt(real)+(real>yMax?' (fuera escala)':'');}}}},
      scales:{
        x:{ticks:{color:'#64748b',font:{size:isBig?8:7},maxRotation:45,autoSkip:!isBig,maxTicksLimit:isBig?20:8},grid:{color:'#1e2535'}},
        y:{min:bMin<0?bMin*1.1:0,max:yMax,
           ticks:{color:'#64748b',font:{size:isBig?8:7},callback:function(v){return fmt(v);},maxTicksLimit:5},grid:{color:'#1e2535'}}
      }},
    plugins:[{id:'oFlag',afterDatasetsDraw:function(chart){
      var ctx=chart.ctx,scales=chart.scales;
      [[iData,'#4D9FFF'],[eData,'#FF4D6A']].forEach(function(pair,di){
        pair[0].forEach(function(v,i){
          if(v>yMax){var meta=chart.getDatasetMeta(di),pt=meta.data[i];if(!pt)return;
            ctx.save();ctx.fillStyle=pair[1];
            ctx.beginPath();ctx.moveTo(pt.x,scales.y.top+2);ctx.lineTo(pt.x-5,scales.y.top+10);ctx.lineTo(pt.x+5,scales.y.top+10);ctx.closePath();ctx.fill();
            ctx.font='bold 7px system-ui';ctx.textAlign='center';ctx.textBaseline='top';
            ctx.fillText(fmt(v),pt.x,scales.y.top+12);ctx.restore();}});});}}]
  });
  var h='';[['Ingresos','#4D9FFF'],['Egresos','#FF4D6A'],['Balance','#00C48C']].forEach(function(p){
    h+='<span style="display:flex;align-items:center;gap:3px"><span style="width:12px;height:2px;background:'+p[1]+';display:inline-block"></span>'+p[0]+'</span>';});
  document.getElementById('legTend').innerHTML=h;

        y:{stacked:true,ticks:{color:'#94a3b8',font:{size:isBig?10:9}},grid:{display:false}}}}
  });
}

function buildTabla(tx,pp){
  var tree={};
  tx.forEach(function(r){
    if(tTipo(r)!=='Egreso')return;
    var r2=tR2(r),r1=tR1(r),nom=tNom(r),desc=tDesc(r)||'(sin descripci\u00f3n)',v=Math.abs(tImp(r));
    if(!tree[r2])tree[r2]={total:0,r1s:{}};tree[r2].total+=v;
    if(!tree[r2].r1s[r1])tree[r2].r1s[r1]={total:0,noms:{}};tree[r2].r1s[r1].total+=v;
    if(!tree[r2].r1s[r1].noms[nom])tree[r2].r1s[r1].noms[nom]={total:0,descs:{}};
    tree[r2].r1s[r1].noms[nom].total+=v;
    tree[r2].r1s[r1].noms[nom].descs[desc]=(tree[r2].r1s[r1].noms[nom].descs[desc]||0)+v;
  });
  var ppT={};
  pp.forEach(function(r){
    if(tTipo(r)!=='Egreso'||tImp(r)===0)return;
    var r2=tR2(r),r1=tR1(r),v=Math.abs(tImp(r));
    if(!ppT[r2])ppT[r2]={total:0,r1s:{}};ppT[r2].total+=v;
    if(!ppT[r2].r1s[r1])ppT[r2].r1s[r1]={total:0};ppT[r2].r1s[r1].total+=v;
  });
  var combined={};Object.keys(tree).forEach(function(k){combined[k]=1;});Object.keys(ppT).forEach(function(k){combined[k]=1;});
  var allR2=Object.keys(combined).sort();
  var expR2={},expR1={},expNom={};allR2.forEach(function(r2){expR2[r2]=false;});

  function draw(){
    var tb=document.getElementById('tblB');if(!tb)return;var h='';
    allR2.forEach(function(r2,r2i){
      var rT=tree[r2]?tree[r2].total:0,pT=ppT[r2]?ppT[r2].total:0;
      var diff=rT-pT,pct=pT>0?Math.round(rT/pT*100):null;
      var dc=diff>0?'#FF4D6A':'#00C48C',pc=pct!=null?(pct>100?'#FF4D6A':pct>85?'#FFB547':'#00C48C'):'#64748b';
      h+='<tr class="tr2" onclick="toggle(\'R2_'+r2i+'\')">';
      h+='<td><button class="tog">'+(expR2[r2]?'&#x25BC;':'&#x25B6;')+'</button>'+esc(r2)+'</td>';
      h+='<td>'+fmt(rT)+'</td><td style="color:#94a3b8">'+(pT>0?fmt(pT):'&#x2014;')+'</td>';
      h+='<td style="color:'+dc+'">'+(pT>0?(diff>0?'+':'')+fmt(diff):'&#x2014;')+'</td>';
      h+='<td style="color:'+pc+'">'+(pct!=null?pct+'%':'&#x2014;')+'</td></tr>';
      if(!expR2[r2])return;
      var r1s=tree[r2]?Object.keys(tree[r2].r1s).sort():[];
      r1s.forEach(function(r1,r1i){
        var k1=r2+'|'+r1;if(expR1[k1]===undefined)expR1[k1]=false;
        var rT1=tree[r2].r1s[r1].total,pT1=ppT[r2]&&ppT[r2].r1s[r1]?ppT[r2].r1s[r1].total:0;
        var d1=rT1-pT1,p1=pT1>0?Math.round(rT1/pT1*100):null;
        var dc1=d1>0?'#FF4D6A':'#00C48C',pc1=p1!=null?(p1>100?'#FF4D6A':p1>85?'#FFB547':'#00C48C'):'#64748b';
        h+='<tr class="tr1" onclick="toggle(\'R1_'+r2i+'_'+r1i+'\')">';
        h+='<td style="padding-left:18px"><button class="tog">'+(expR1[k1]?'&#x25BC;':'&#x25B6;')+'</button>'+esc(r1)+'</td>';
        h+='<td>'+fmt(rT1)+'</td><td style="color:#64748b">'+(pT1>0?fmt(pT1):'&#x2014;')+'</td>';
        h+='<td style="color:'+dc1+'">'+(pT1>0?(d1>0?'+':'')+fmt(d1):'&#x2014;')+'</td>';
        h+='<td style="color:'+pc1+'">'+(p1!=null?p1+'%':'&#x2014;')+'</td></tr>';
        if(!expR1[k1])return;
        var noms=Object.keys(tree[r2].r1s[r1].noms).sort();
        noms.forEach(function(nom,ni){
          var kn=r2+'|'+r1+'|'+nom;if(expNom[kn]===undefined)expNom[kn]=false;
          var rTN=tree[r2].r1s[r1].noms[nom].total;
          h+='<tr class="trp" onclick="toggle(\'NOM_'+r2i+'_'+r1i+'_'+ni+'\')">';
          h+='<td style="padding-left:34px"><button class="tog">'+(expNom[kn]?'&#x25BC;':'&#x25B6;')+'</button>&#x1F464; '+esc(nom)+'</td>';
          h+='<td>'+fmt(rTN)+'</td><td style="color:#64748b">&#x2014;</td><td>&#x2014;</td><td>&#x2014;</td></tr>';
          if(!expNom[kn])return;
          var descs=Object.entries(tree[r2].r1s[r1].noms[nom].descs).sort(function(a,b){return b[1]-a[1];});
          descs.forEach(function(de){
            h+='<tr class="trd"><td style="padding-left:50px">&#x2514; '+esc(de[0])+'</td>';
            h+='<td>'+fmt(de[1])+'</td><td style="color:#64748b">&#x2014;</td><td>&#x2014;</td><td>&#x2014;</td></tr>';
          });
        });
      });
    });
    tb.innerHTML=h||'<tr><td colspan="5" style="text-align:center;color:#64748b;padding:12px">Sin datos</td></tr>';
  }

  window.toggle=function(id){
    if(id.indexOf('R2_')===0){var i=+id.slice(3);expR2[allR2[i]]=!expR2[allR2[i]];}
    else if(id.indexOf('R1_')===0){var p=id.slice(3).split('_');var r2=allR2[+p[0]];
      var r1=Object.keys(tree[r2].r1s).sort()[+p[1]];var k=r2+'|'+r1;
      if(expR1[k]===undefined)expR1[k]=false;expR1[k]=!expR1[k];}
    else if(id.indexOf('NOM_')===0){var p=id.slice(4).split('_');var r2=allR2[+p[0]];
      var r1=Object.keys(tree[r2].r1s).sort()[+p[1]];
      var nom=Object.keys(tree[r2].r1s[r1].noms).sort()[+p[2]];
      var k=r2+'|'+r1+'|'+nom;if(expNom[k]===undefined)expNom[k]=false;expNom[k]=!expNom[k];}
    draw();
  };
  draw();
}

var resizeTimer;
window.addEventListener('resize',function(){clearTimeout(resizeTimer);resizeTimer=setTimeout(function(){render();},300);});

// ── ARRANCAR ──────────────────────────────────────────────────────────────────
window.addEventListener('DOMContentLoaded',function(){
  loadData(false);
});

</script>
